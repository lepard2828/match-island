name: Test and Deploy Match Island

on:
  push:
    branches: [main, master]
    paths:
      - "match-island/**"
      - ".github/workflows/deploy-match-island.yml"
  pull_request:
    paths:
      - "match-island/**"
      - ".github/workflows/deploy-match-island.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-island-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install browser testing tools
        run: |
          python -m pip install -r match-island/requirements-test.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Run gameplay and responsive tests
        run: python match-island/test_browser.py
      - name: Package public files only
        run: python match-island/build_release.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: match-island/dist/site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
